services:
  hw-pulse-redis:
    image: redis:7
    container_name: hw-pulse-redis
    restart: always
    networks:
      - hw-pulse-network

  hw-pulse-api:
    container_name: hw-pulse-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      REDIS_HOST: hw-pulse-redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      - hw-pulse-redis
    networks:
      - hw-pulse-network

  hw-pulse-bot:
    container_name: hw-pulse-bot
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      REDIS_HOST: hw-pulse-redis
      REDIS_PORT: 6379
      BOT_TOKEN: ${BOT_TOKEN}
    env_file:
      - .env
    depends_on:
      - hw-pulse-redis
      - hw-pulse-api
    networks:
      - hw-pulse-network

networks:
  hw-pulse-network:
    driver: bridge
